# This workflow creates an Odin environment and runs all tests for all exercises.

name: odin/Test

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-26.04

    steps:
      - name: Download Clang
        run: wget https://apt.llvm.org/llvm.sh

      - name: Set install script permissions
        run: chmod u+x llvm.sh

      - name: Install Clang 21
        run: sudo ./llvm.sh 21

      - name: Setup default version
        run: sudo ln -f /usr/bin/clang-21 /usr/bin/clang

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Odin
        uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: 21
          release: dev-2026-07a

      - name: Install odinfmt
        run: bin/fetch-ols-odinfmt.sh

      - name: Verify all exercises
        run: bin/verify-exercises
